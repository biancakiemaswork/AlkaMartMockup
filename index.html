.container{width:100%;max-width:1240px;margin:0 auto;padding:0 16px}
.section{padding:36px 16px}
.narrow{max-width:760px}
.muted{color:var(--gray)}.small{font-size:.85rem}.nowrap{white-space:nowrap}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:12px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:var(--r);border:1.5px solid transparent;font:inherit;font-weight:600;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--red);color:#fff}.btn.primary:hover{background:var(--red-dark)}
.btn.outline{background:#fff;border-color:var(--line);color:var(--ink)}.btn.outline:hover{border-color:var(--blue);color:var(--blue)}
.btn.lg{min-height:50px;padding:0 26px}.btn.full{width:100%}
.btn:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;border-color:transparent}
.link-btn{background:none;border:0;color:var(--blue);font:inherit;cursor:pointer;padding:6px 4px;text-decoration:underline}
.announce{background:var(--ink);color:#fff;text-align:center;font-size:.85rem;padding:7px 12px}
.header{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.header-in{display:flex;align-items:center;gap:16px;padding-top:10px;padding-bottom:10px}
.logo{height:52px;width:auto}
.search{position:relative;flex:1;display:flex;gap:8px;min-width:0}
.search input{flex:1;min-width:0;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:var(--r);font:inherit}
.suggest{position:absolute;top:50px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);list-style:none;margin:0;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.1)}
.suggest a{display:block;padding:9px 10px;text-decoration:none;border-radius:6px}.suggest a:hover{background:var(--bg)}
.suggest small{color:var(--gray);margin-left:6px}
.actions{display:flex;gap:6px}
.icon-btn{position:relative;display:flex;flex-direction:column;align-items:center;min-width:52px;min-height:44px;padding:2px 8px;text-decoration:none;font-size:1.3rem;line-height:1.2}
.icon-btn .lbl{font-size:.7rem;color:var(--gray)}
.badge{position:absolute;top:-2px;right:2px;background:var(--red);color:#fff;border-radius:99px;font-size:.7rem;font-weight:700;min-width:20px;height:20px;display:grid;place-items:center;padding:0 5px}
.catbar{border-top:1px solid var(--line);background:#fff}
.catbar-in{display:flex;align-items:center}
.menu-btn{display:none;background:none;border:0;font:inherit;font-weight:600;min-height:44px;cursor:pointer}
.cats{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.cats a{white-space:nowrap;padding:10px 12px;text-decoration:none;font-size:.9rem;font-weight:500;border-bottom:3px solid transparent}
.cats a:hover,.cats a.active{color:var(--red);border-bottom-color:var(--red)}
.hero{background:linear-gradient(#fff,var(--bg));text-align:center;padding-bottom:36px}
.hero-banner{width:100%;max-width:1920px;margin:0 auto}
.hero-in{max-width:760px}
.hero-in p{font-size:1.1rem;color:var(--gray)}
.hero-in .row{justify-content:center}
.tag{font-weight:600;color:var(--blue)!important;font-size:.95rem!important}
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cat-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 8px;border:1px solid var(--line);border-radius:var(--r);text-decoration:none;font-weight:600;text-align:center;font-size:.92rem;background:#fff}
.cat-card:hover{border-color:var(--red);color:var(--red)}
.cat-icon{font-size:2rem}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.sec-head a{color:var(--blue);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px}
.card{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:var(--r);padding:10px;background:#fff}
.card-open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;flex:1}
.card-open:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.card h3{margin:0;font-size:.95rem;min-height:2.4em}
.brand{font-size:.78rem;font-weight:600;color:var(--blue)}
.size{font-size:.85rem;color:var(--gray)}
.price{font-weight:800;font-size:1.1rem;color:var(--red)}.price-wrap{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.was{color:var(--gray);font-size:.85rem}
.stock{font-size:.8rem;font-weight:600}.stock.ok{color:var(--green)}.stock.low{color:#B45309}.stock.out{color:var(--gray)}
.pimg{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--bg);border-radius:8px}
.placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--gray)}
.ph-icon{font-size:2.6rem}.ph-brand{font-size:.75rem;font-weight:600}
.benefits{background:var(--bg);padding:36px 0}
.benefit-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.benefit-grid>div{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;border-top:3px solid var(--blue)}
.benefit-grid p{margin:0;color:var(--gray);font-size:.9rem}
.supplier{display:grid;grid-template-columns:minmax(200px,340px) 1fr;gap:32px;align-items:center}
.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin:12px 0 20px}
.toolbar label{display:flex;flex-direction:column;font-size:.8rem;font-weight:600;gap:4px}
.toolbar select,.inp,.field input,.field select,.field textarea,.table input,.table select{font:inherit;padding:9px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
.toolbar .check,.check{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:.9rem;display:flex}
.count{margin-left:auto;color:var(--gray);font-size:.9rem}
.empty{text-align:center;padding:60px 16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:24px;position:relative}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.close{position:absolute;top:8px;right:8px;width:44px;height:44px;border:0;background:none;font-size:1.2rem;cursor:pointer}
.big .price{font-size:1.7rem}
.qty{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{width:40px;min-height:42px;border:0;background:var(--bg);font-size:1.1rem;cursor:pointer}.qty button:disabled{opacity:.4}
.qty input{width:48px;text-align:center;border:0;font:inherit}
.note{background:#EAF6FC;border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;font-size:.9rem}
.alert{background:#FEF2F2;border-left:4px solid var(--red);padding:10px 12px;border-radius:6px;margin:12px 0}
.cart-layout{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
.cart-list{list-style:none;margin:0;padding:0}
.cart-line{display:grid;grid-template-columns:72px 1fr auto 110px auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.cart-info{display:flex;flex-direction:column;min-width:0}
.thumb .pimg{border-radius:6px}.thumb .ph-icon{font-size:1.6rem}.thumb .ph-brand{display:none}
.line-total{text-align:right}
.summary{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--bg);position:sticky;top:130px;display:flex;flex-direction:column;gap:10px}
.srow{display:flex;justify-content:space-between;gap:12px;padding:4px 0}.srow.total{font-size:1.2rem;border-top:1px solid var(--line);padding-top:10px}
.mini{list-style:none;margin:0;padding:0;font-size:.9rem}.mini li{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
fieldset{border:1px solid var(--line);border-radius:var(--r);margin:0 0 18px;padding:16px;display:flex;flex-direction:column;gap:12px}
legend{font-weight:700;padding:0 6px}
.field{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.88rem}.field.bad input,.field.bad textarea{border-color:var(--red)}
.err{color:var(--red);font-weight:500;font-size:.82rem}
.radio{display:flex;gap:8px;align-items:center;min-height:44px}
.confirm{background:#EEF8F0;border:1px solid #BFE3C8;border-radius:var(--r);padding:20px;margin-bottom:20px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);margin:12px 0}
.table{width:100%;border-collapse:collapse;font-size:.9rem}.table th,.table td{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
.table th{background:var(--bg);font-size:.8rem}.wide-t{min-width:980px}
.table .num{width:110px}.table .num.sm{width:90px}.table .url{width:180px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:inherit;font-weight:600;cursor:pointer;color:var(--gray)}.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:12px}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column}.stat span{color:var(--gray);font-size:.85rem}.stat strong{font-size:1.5rem}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:12px 0;background:#fff}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:12px}.form-grid .wide{grid-column:1/-1}
.footer{background:var(--bg);border-top:1px solid var(--line);margin-top:40px;padding-top:32px;font-size:.9rem}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:24px}
.foot-logo{width:200px;margin-bottom:8px}
.footer ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}.footer h4{font-size:.95rem}.footer a{text-decoration:none}.footer a:hover{color:var(--red)}
.copy{padding:20px 16px;color:var(--gray);font-size:.82rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:99px;z-index:60;font-size:.9rem;max-width:90vw}
@media (max-width:1100px){.grid{grid-template-columns:repeat(4,1fr)}.cat-grid{grid-template-columns:repeat(5,1fr)}}
@media (max-width:900px){
  .grid{grid-template-columns:repeat(3,1fr)}.cat-grid{grid-template-columns:repeat(3,1fr)}
  .benefit-grid{grid-template-columns:repeat(2,1fr)}.cart-layout{grid-template-columns:1fr}.summary{position:static}
  .supplier{grid-template-columns:1fr}.foot-grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  .grid{grid-template-columns:repeat(2,1fr);gap:10px}.cat-grid{grid-template-columns:repeat(2,1fr)}
  .header-in{flex-wrap:wrap;gap:8px}.logo{height:40px}.actions{margin-left:auto}.search{order:3;flex-basis:100%}.search .btn{padding:0 12px}.icon-btn .lbl{display:none}
  .menu-btn{display:block}.cats{display:none;flex-direction:column;width:100%}.cats.open{display:flex}
  .modal-grid,.form-grid,.foot-grid,.benefit-grid{grid-template-columns:1fr}
  .cart-line{grid-template-columns:64px 1fr;grid-template-areas:"t i" "q l" "r r"}
  .cart-line .thumb{grid-area:t}.cart-line .cart-info{grid-area:i}.cart-line .qty{grid-area:q}.cart-line .line-total{grid-area:l}.cart-line .link-btn{grid-area:r;justify-self:start}
  .section{padding:24px 12px}.count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}


/* ===== Modern redesign ===== */
:root{--navy:#0F1F3D;--r:16px}
body{background:#FAFAFA;color:var(--navy)}
h1,h2,h3{color:var(--navy)}
h2,.h2{font-weight:800;letter-spacing:-.025em}
.section>h2:not(.h2),.sec-head h2{font-size:1.9rem;margin-bottom:20px}
.section>h2:not(.h2)::after,.sec-head h2::after{content:"";display:block;width:48px;height:4px;background:var(--red);border-radius:4px;margin-top:10px}
.btn{border-radius:999px}.btn.primary{box-shadow:0 6px 16px rgba(230,0,18,.25)}.btn.outline{border-color:#D8DCE3}
.header{background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:0;box-shadow:0 1px 0 var(--line)}
.search input{border-radius:999px;background:#F1F3F6;border-color:transparent;padding-left:20px}.search input:focus{background:#fff;border-color:var(--blue)}
.catbar{background:transparent;border-top:0}.cats a{border-radius:999px;border-bottom:0;margin:4px 2px;padding:7px 14px;background:transparent}.cats a:hover,.cats a.active{background:#FDECEE;color:var(--red)}
.hero2{background:linear-gradient(180deg,#fff,#FAFAFA);overflow:hidden}
.hero2-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:48px;padding-bottom:24px}
.eyebrow{letter-spacing:.32em;text-transform:uppercase;font-weight:600;font-size:.78rem;margin:0 0 14px}
.hero2 h1{font-size:clamp(2.2rem,5vw,3.9rem);font-weight:800;line-height:1.05;margin:0 0 16px}.hero2 h1 span{color:var(--red);display:block}
.lead{font-size:1.1rem;color:var(--gray);max-width:30em;margin:0 0 8px}
.hero2 .tag{color:var(--blue);font-weight:600;font-size:.95rem}
.hero2-art{position:relative;padding:20px 0 24px 24px}
.hero2-art img{position:relative;z-index:2;width:100%;aspect-ratio:4/4.4;object-fit:cover;border-radius:40px 150px 40px 40px;box-shadow:0 28px 60px rgba(15,31,61,.2)}
.hero2-art .swoosh{position:absolute;z-index:1;left:0;top:0;width:72%;height:68%;background:var(--red);border-radius:60px 0 0 150px;transform:rotate(-5deg)}
.hero2-art .blue{position:absolute;z-index:1;left:-8%;bottom:0;width:48%;height:46%;background:var(--blue);clip-path:polygon(0 100%,100% 100%,52% 0)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);padding-top:12px;padding-bottom:40px}
.feat{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:6px 12px;font-weight:600;font-size:.92rem;border-left:1px solid var(--line);line-height:1.3}.feat:first-child{border-left:0}
.feat svg{width:38px;height:38px;stroke:var(--red);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.cat-grid{grid-template-columns:repeat(10,1fr);gap:6px}
.cat-card{border:0;background:transparent;padding:6px 2px;font-size:.78rem;line-height:1.25;color:var(--navy)}
.cat-icon{width:70px;height:70px;border-radius:50%;background:#fff;box-shadow:0 4px 14px rgba(15,31,61,.09);display:grid;place-items:center;font-size:1.9rem;transition:transform .15s}
.cat-card:hover .cat-icon{transform:translateY(-3px);box-shadow:0 10px 22px rgba(230,0,18,.18)}
.card{border-radius:20px;border-color:transparent;box-shadow:0 2px 14px rgba(15,31,61,.07);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(15,31,61,.13)}
.pimg{border-radius:14px}.brand{letter-spacing:.02em}
.benefits{background:#fff}.benefit-grid>div{border:0;border-radius:20px;box-shadow:0 2px 14px rgba(15,31,61,.07);border-top:0;background:#FAFAFA}
.supplier{background:#fff;border-radius:28px;box-shadow:0 2px 20px rgba(15,31,61,.07);margin-top:36px;margin-bottom:12px;padding:32px}
.modal,.summary,.panel,.table-wrap,fieldset{border-radius:20px}
.footer{background:#fff;border-top:0;box-shadow:0 -1px 0 var(--line)}
.bnav{display:none}
@media (max-width:900px){.hero2-in{grid-template-columns:1fr;gap:24px;padding-top:28px}.cat-grid{grid-template-columns:repeat(5,1fr)}.feats{grid-template-columns:repeat(2,1fr);gap:16px 0}.feat:nth-child(odd){border-left:0}.feat:nth-child(3){border-left:0}}
@media (max-width:640px){
 .cat-grid{display:flex;overflow-x:auto;gap:8px;padding-bottom:8px;scrollbar-width:none}.cat-card{min-width:84px;flex:0 0 auto}.cat-icon{width:62px;height:62px}
 .hero2 h1{font-size:2.3rem}.hero2-art{padding:12px 0 16px 12px}
 .actions{display:none}.header-in{gap:8px;flex-wrap:nowrap}.search{order:0;flex:1}.search .btn{padding:0 14px;font-size:.85rem;min-height:40px}.search input{height:40px}.logo{height:34px}
 .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,31,61,.06)}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;font-size:.7rem;font-weight:600;color:var(--gray);text-decoration:none;position:relative;gap:1px;min-height:44px;justify-content:center}.bnav a.on{color:var(--red)}.bnav i{font-style:normal;font-size:1.25rem;line-height:1.2}
 .bnav .badge{top:0;right:calc(50% - 22px)}
 body{padding-bottom:72px}.toast{bottom:88px}
}
.placeholder[hidden]{display:none}
.hidden{display:none}
</style>

const K={p:"alka.products.v1",s:"alka.settings.v1",c:"alka.cart.v1",o:"alka.orders.v1"};
const ld=(k,f)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):f}catch{return f}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));return true}catch{return false}};
let P=ld(K.p,SEED),ST={...DEF,...ld(K.s,{})},CART=ld(K.c,[]),ORD=ld(K.o,[]);
ST.contact={...DEF.contact,...ST.contact};

function shrink(file,max=600){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const i=new Image();i.onerror=rej;i.onload=()=>{const s=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};i.src=r.result};r.readAsDataURL(file)})}
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rp=n=>(n<0?"-":"")+"Rp"+String(Math.abs(Math.round(n))).replace(/\B(?=(\d{3})+(?!\d))/g,".");
const $=s=>document.querySelector(s);

/* ---------- pricing (integer math, rounded UP to next Rp100) ---------- */
function calc(cost,m){cost=Number(cost);m=Number(m);
 if(!Number.isInteger(cost)||cost<=0)throw Error("Supplier price must be a positive whole number of rupiah.");
 if(!Number.isFinite(m)||m<5||m>10)throw Error("Markup must be between 5% and 10%.");
 return Math.ceil(cost*(10000+Math.round(m*100))/1000000)*100}
const mk=p=>p.markupPercent==null||p.markupPercent===""?ST.defaultMarkup:Number(p.markupPercent);
const retail=p=>{try{return calc(p.supplierPrice,mk(p))}catch{return null}};
const promoOn=p=>{const o=p.promo;if(!o||!o.enabled||!Number.isInteger(o.price)||o.price<=0)return false;const t=Date.now();
 if(o.start&&t<new Date(o.start+"T00:00:00").getTime())return false;if(o.end&&t>new Date(o.end+"T23:59:59").getTime())return false;return true};
const unit=p=>{const b=retail(p);if(b===null)return null;return promoOn(p)&&p.promo.price<b?p.promo.price:b};
const byId=id=>P.find(p=>p.id===id);
const maxQ=p=>p&&p.inStock?Math.max(0,p.stockQuantity):0;
const lines=()=>CART.map(l=>{const p=byId(l.id);if(!p||p.visible===false)return null;const u=unit(p),q=Math.min(l.qty,maxQ(p));return u===null||q<1?null:{p,q,u,s:u*q}}).filter(Boolean);
const count=()=>lines().reduce((n,l)=>n+l.q,0);
const sub=()=>lines().reduce((n,l)=>n+l.s,0);

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(tt);tt=setTimeout(()=>t.classList.add("hidden"),2200)}
function img(p,large){const a=esc(`${p.brand} ${p.name} ${p.size}`);
 const ph=`<div class="pimg placeholder" role="img" aria-label="${esc(p.name)} (image placeholder)" ${p.image?"hidden":""}><span class="ph-icon">${ic(p.category)}</span><span class="ph-brand">${esc(p.brand)}</span></div>`;
 return (p.image?`<img class="pimg" src="${esc(p.image)}" alt="${a}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false">`:"")+ph}
function priceHtml(p){const u=unit(p);if(u===null)return`<span class="price muted">Price unavailable</span>`;const b=retail(p);
 return`<span class="price-wrap"><span class="price">${rp(u)}</span>${u<b?`<s class="was">${rp(b)}</s>`:""}</span>`}
function stockHtml(p){const q=maxQ(p);return`<span class="stock ${q<1?"out":q<=5?"low":"ok"}">${q<1?"Out of stock":q<=5?"Only "+q+" left":"In stock"}</span>`}
function card(p){const q=maxQ(p);return`<article class="card"><button class="card-open" data-act="open" data-id="${p.id}" aria-label="View details for ${esc(p.name)}">${img(p)}<div class="card-body"><span class="brand">${esc(p.brand)}</span><h3>${esc(p.name)}</h3><span class="size">${esc(p.size)}</span>${priceHtml(p)}${stockHtml(p)}</div></button><button class="btn primary full" data-act="add" data-id="${p.id}" ${q<1||unit(p)===null?"disabled":""}>${q<1?"Out of stock":"Add to cart"}</button></article>`}
const vis=()=>P.filter(p=>p.visible!==false);
const shopHash=o=>"#/shop"+(Object.values(o).some(Boolean)?"?"+new URLSearchParams(Object.entries(o).filter(([,v])=>v)):"");

/* ---------- cart / orders ---------- */
function addCart(id,n=1){const p=byId(id);if(!p||maxQ(p)<1)return toast("This product is out of stock.");
 const c=CART.find(l=>l.id===id);const q=Math.min((c?c.qty:0)+Math.max(1,n|0),maxQ(p));
 if(c)c.qty=q;else CART.push({id,qty:q});save();badge();toast(p.name+" added to cart")}
function setQty(id,n){const p=byId(id);n=Math.max(0,Math.min(Math.floor(Number(n)||0),maxQ(p)));
 CART=n<1?CART.filter(l=>l.id!==id):CART.map(l=>l.id===id?{...l,qty:n}:l);save();rr()}
function badge(){const n=count();document.querySelectorAll(".cartbadge").forEach(b=>{b.textContent=n;b.classList.toggle("hidden",!n)})}
function placeOrder(cust,pay){const L=lines();if(!L.length)return null;const d=new Date();
 const ymd=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
 const no=`ALK-${ymd}-${String(ORD.filter(o=>o.number.includes(ymd)).length+1).padStart(4,"0")}`;
 const s=sub();ORD.unshift({number:no,createdAt:d.toISOString(),status:"New (demo)",customer:cust,payment:pay,
  items:L.map(l=>({id:l.p.id,name:l.p.name,size:l.p.size,qty:l.q,unit:l.u,subtotal:l.s})),subtotal:s,deliveryFee:ST.deliveryFee,total:s+ST.deliveryFee});
 L.forEach(l=>{l.p.stockQuantity-=l.q;l.p.inStock=l.p.stockQuantity>0});CART=[];save();return no}
function waLink(o){const t=`Hello ALKA MART, I would like to order (ref ${o.number}):\n`+o.items.map(i=>`- ${i.qty} x ${i.name} (${i.size}) = ${rp(i.subtotal)}`).join("\n")+`\nSubtotal: ${rp(o.subtotal)}\nDelivery: ${rp(o.deliveryFee)}\nTotal: ${rp(o.total)}\n\nName: ${o.customer.name}\nAddress: ${o.customer.address}`;
 return`https://wa.me/${ST.whatsappNumber.replace(/\D/g,"")}?text=${encodeURIComponent(t)}`}

let SORT="default",AVAIL=false;
function shop(R){const q=(R.q.q||"").trim().toLowerCase(),cat=R.q.cat||"",fo=R.q.featured==="1";
 let l=vis();if(cat)l=l.filter(p=>p.category===cat);if(fo)l=l.filter(p=>p.featured);if(AVAIL)l=l.filter(p=>maxQ(p)>0);
 if(q)l=l.filter(p=>`${p.name} ${p.brand} ${p.size} ${p.category}`.toLowerCase().includes(q));
 const by={asc:(a,b)=>(unit(a)??1e12)-(unit(b)??1e12),desc:(a,b)=>(unit(b)??0)-(unit(a)??0),az:(a,b)=>a.name.localeCompare(b.name)};
 if(by[SORT])l=[...l].sort(by[SORT]);const f=cat||q||fo||AVAIL||SORT!=="default";
 return`<div class="container section"><h1 class="h2">${esc(cat||(fo?"Featured products":q?`Results for “${R.q.q}”`:"All products"))}</h1>
<div class="toolbar"><label>Category<select data-f="cat"><option value="">All categories</option>${CATS.map(c=>`<option ${c[0]===cat?"selected":""}>${c[0]}</option>`).join("")}</select></label>
<label>Sort by<select data-f="sort">${[["default","Recommended"],["asc","Price: low to high"],["desc","Price: high to low"],["az","Name: A to Z"]].map(o=>`<option value="${o[0]}" ${SORT===o[0]?"selected":""}>${o[1]}</option>`).join("")}</select></label>
<label class="check"><input type="checkbox" data-f="avail" ${AVAIL?"checked":""}> Available only</label>${f?`<button class="btn outline" data-act="clearf">Clear filters</button>`:""}<span class="count" aria-live="polite">${l.length} ${l.length===1?"product":"products"}</span></div>
${l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<div class="empty"><h2>No products found</h2><p>Try a different spelling, or remove some filters.</p><button class="btn primary" data-act="clearf">Clear filters</button></div>`}</div>`}

<div class="qty"><button data-act="dec" data-id="${l.p.id}" aria-label="Decrease quantity">−</button><input data-qin="${l.p.id}" value="${l.q}" inputmode="numeric" aria-label="Quantity"><button data-act="inc" data-id="${l.p.id}" aria-label="Increase quantity" ${l.q>=maxQ(l.p)?"disabled":""}>+</button></div>
<strong class="line-total">${rp(l.s)}</strong><button class="link-btn" data-act="rm" data-id="${l.p.id}">Remove</button></li>`).join("")}</ul>

let CV={name:"",phone:"",email:"",address:"",notes:"",pay:"Cash on Delivery"},CE={},CTOP="";
function validate(f){const e={},ph=f.phone.replace(/[\s-]/g,"");
 if(f.name.trim().length<3)e.name="Enter your full name.";
 if(!/^(\+62|62|0)8\d{7,12}$/.test(ph))e.phone="Enter a valid Indonesian mobile number, e.g. 0812 3456 7890.";
 if(f.email&&!/^\S+@\S+\.\S+$/.test(f.email))e.email="Enter a valid email address or leave it empty.";
 if(f.address.trim().length<10)e.address="Enter a complete delivery address.";return e}

 const fld=(k,lb,o={})=>`<label class="field ${CE[k]?"bad":""}">${lb}${o.area?`<textarea name="${k}" rows="3">${esc(CV[k])}</textarea>`:`<input name="${k}" type="${o.type||"text"}" value="${esc(CV[k])}" aria-invalid="${!!CE[k]}">`}${CE[k]?`<span class="err" role="alert">${CE[k]}</span>`:""}</label>`;

<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Product</th><th>Category</th><th>Stock</th><th>Visible</th><th></th></tr></thead><tbody>${P.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)} <small>${esc(p.brand)} · ${esc(p.size)}</small></td><td>${p.category}</td><td>${p.stockQuantity}</td><td>${p.visible===false?"No":"Yes"}</td><td class="nowrap"><button class="link-btn" data-act="editp" data-id="${p.id}">Edit</button> <button class="link-btn" data-act="delp" data-id="${p.id}">Delete</button></td></tr>`).join("")}</tbody></table></div>`}
 if(t==="Pricing")return`<div class="panel"><h3>Default markup</h3><div class="row"><input id="dm" type="number" step="0.5" class="inp" value="${ST.defaultMarkup}" aria-label="Default markup percent"><span>%</span><button class="btn primary" data-act="applym">Apply to all products</button></div>${AD.err?`<div class="alert" role="alert">${AD.err}</div>`:""}<p class="muted small">Selling price = supplier cost × (1 + markup), rounded up to the next Rp100. Gross profit is selling price minus supplier cost. It is not net profit: packaging, delivery, payment fees, discounts, taxes, returns, and operating costs still apply, and a 5–10% markup does not guarantee profitability.</p><p class="note">“Estimated” prices are demonstration values, not live Lotte Grosir prices. Mark a price “Verified” only after checking it against the supplier.</p></div>
<div class="table-wrap"><table class="table wide-t"><thead><tr><th>Product</th><th>Supplier cost (Rp)</th><th>Price status</th><th>Source URL</th><th>Markup %</th><th>Preview</th><th></th></tr></thead><tbody>${P.map(p=>`<tr class="prow" data-id="${p.id}"><td>${esc(p.name)} <small>${esc(p.size)}</small></td><td><input type="number" class="num pc" value="${p.supplierPrice}" aria-label="Supplier cost"></td><td><select class="pt"><option value="estimated" ${p.priceType==="estimated"?"selected":""}>Estimated</option><option value="verified" ${p.priceType==="verified"?"selected":""}>Verified</option></select></td><td><input class="url pu" placeholder="Source URL (optional)" value="${esc(p.sourceUrl||"")}"></td><td><input type="number" step="0.5" class="num sm pm" placeholder="${ST.defaultMarkup} (default)" value="${p.markupPercent??""}" aria-label="Markup percent"></td><td class="pv">${prev(p.supplierPrice,p.markupPercent)}</td><td><button class="btn primary" data-act="savepr" data-id="${p.id}">Save</button></td></tr>`).join("")}</tbody></table></div>`;
 if(t==="Promotions")return`<p class="note">A promotion only appears to customers when it is enabled, inside its date range, and below the retail price. The struck-through price is always the real retail price.</p><div class="table-wrap"><table class="table wide-t"><thead><tr><th>Product</th><th>Retail price</th><th>Featured</th><th>Promo on</th><th>Promo price</th><th>Start</th><th>End</th><th></th></tr></thead><tbody>${P.map(p=>`<tr class="qrow" data-id="${p.id}"><td>${esc(p.name)} <small>${esc(p.size)}</small></td><td>${retail(p)===null?"-":rp(retail(p))}</td><td><input type="checkbox" class="qf" ${p.featured?"checked":""} aria-label="Featured"></td><td><input type="checkbox" class="qe" ${p.promo&&p.promo.enabled?"checked":""} aria-label="Promotion enabled"></td><td><input type="number" class="num qp" value="${p.promo&&p.promo.price||""}" aria-label="Promo price"></td><td><input type="date" class="qs" value="${p.promo?p.promo.start:""}" aria-label="Start date"></td><td><input type="date" class="qd" value="${p.promo?p.promo.end:""}" aria-label="End date"></td><td><button class="btn primary" data-act="savepromo" data-id="${p.id}">Save</button><div class="err qerr"></div></td></tr>`).join("")}</tbody></table></div>`;
 if(t==="Orders"){if(!ORD.length)return`<p class="muted">No demo orders yet. Place one from the storefront checkout.</p>`;
  return`<p class="note">Demo orders are stored in this browser only and are not connected to any delivery system.</p><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Customer</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${ORD.map(o=>`<tr><td>${o.number}</td><td>${new Date(o.createdAt).toLocaleString("id-ID")}</td><td>${esc(o.customer.name)}</td><td>${rp(o.total)}</td><td><select data-ostat="${o.number}" aria-label="Order status">${STAT.map(s=>`<option ${s===o.status?"selected":""}>${s}</option>`).join("")}</select></td><td><button class="link-btn" data-act="osel" data-id="${o.number}">Details</button></td></tr>`).join("")}</tbody></table></div>${ORD.filter(o=>o.number===AD.sel).map(o=>`<div class="panel"><h3>${o.number}</h3><p>${esc(o.customer.name)} · ${esc(o.customer.phone)}${o.customer.email?" · "+esc(o.customer.email):""}<br>${esc(o.customer.address)}${o.customer.notes?`<br>Notes: ${esc(o.customer.notes)}`:""}<br>Payment (demo): ${esc(o.payment)}</p><ul>${o.items.map(i=>`<li>${i.qty} × ${esc(i.name)} (${esc(i.size)}) = ${rp(i.subtotal)}</li>`).join("")}</ul><p>Subtotal ${rp(o.subtotal)} + delivery ${rp(o.deliveryFee)} = <strong>${rp(o.total)}</strong></p></div>`).join("")}`}
 const c=ST.contact;
 return`<div class="panel"><div class="form-grid"><label class="field">Delivery fee (Rp)<input id="s_fee" type="number" min="0" value="${ST.deliveryFee}"></label><label class="field">WhatsApp number (62…, empty hides the button)<input id="s_wa" value="${esc(ST.whatsappNumber)}"></label><label class="field wide">Announcement bar (empty hides it)<input id="s_ann" value="${esc(ST.announcement)}"></label><label class="field wide">Tagline<input id="s_tag" value="${esc(ST.tagline)}"></label><label class="field">Contact phone<input id="s_ph" value="${esc(c.phone)}"></label><label class="field">Contact email<input id="s_em" value="${esc(c.email)}"></label><label class="field wide">Address<input id="s_ad" value="${esc(c.address)}"></label><label class="field">Instagram URL<input id="s_ig" value="${esc(c.instagram)}"></label><label class="field">Facebook URL<input id="s_fb" value="${esc(c.facebook)}"></label></div><div class="row"><button class="btn primary" data-act="savesettings">Save settings</button><button class="btn outline" data-act="reset">Reset demo data</button></div></div>`}
function prev(cost,m){try{const mm=m===""||m==null?ST.defaultMarkup:Number(m),s=calc(cost,mm);return`<strong>${rp(s)}</strong><br><small>Gross profit/unit ${rp(s-Number(cost))}</small>`}catch(e){return`<span class="err">${e.message}</span>`}}

/* ---------- render + routing ---------- */
function getRoute(){const h=location.hash.replace(/^#/,"")||"/";const[path,qs=""]=h.split("?");return{path,q:Object.fromEntries(new URLSearchParams(qs))}}
function render(){const R=getRoute();let pg;
 if(R.path==="/shop")pg=shop(R);else if(R.path==="/cart")pg=cart();else if(R.path==="/checkout")pg=checkout();else if(R.path==="/admin")pg=admin();
 else if(R.path.startsWith("/order/"))pg=order(decodeURIComponent(R.path.slice(7)));else if(R.path.startsWith("/info/"))pg=info(R.path.slice(6));else pg=home();
 $("#app").innerHTML=header(R)+"<main>"+pg+"</main>"+footer()}
function rr(){const y=scrollY;render();scrollTo(0,y)}
addEventListener("hashchange",()=>{if(!location.hash.startsWith("#/checkout")){CE={};CTOP=""}render();scrollTo(0,0)});

/* ---------- modal ---------- */
function openModal(id){const p=byId(id);if(!p)return;const q=maxQ(p);
 $("#modal").innerHTML=`<div class="overlay" data-act="close"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(p.name)}"><button class="close" data-act="close" aria-label="Close">✕</button><div class="modal-grid">${img(p,1)}<div><span class="brand">${esc(p.brand)}</span><h2>${esc(p.name)}</h2><p class="size">${esc(p.size)} · ${p.category}</p><div class="big">${priceHtml(p)}</div><p class="stock ${q<1?"out":"ok"}">${q<1?"Out of stock":`In stock (${q} available)`}</p><p>${esc(p.description)}</p>${p.storage==="frozen"?`<p class="note">Frozen product. Delivery of frozen items is subject to confirmation and is not guaranteed in this prototype.</p>`:""}${q>0?`<div class="row"><div class="qty"><button data-act="mdec" aria-label="Decrease quantity">−</button><input id="mq" value="1" readonly aria-label="Quantity"><button data-act="minc" data-max="${q}" aria-label="Increase quantity">+</button></div><button class="btn primary" data-act="madd" data-id="${p.id}">Add to cart</button></div>`:""}</div></div></div></div>`;
 const c=$("#modal .close");if(c)c.focus()}
const closeModal=()=>{$("#modal").innerHTML=""};
addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});

/* ---------- events ---------- */
const numv=id=>Number($(id).value),val=id=>$(id).value;
const ACT={
 open:t=>openModal(t.dataset.id),add:t=>addCart(t.dataset.id),
 close:(t,e)=>{if(e.target===t)closeModal()},
 mdec:()=>{const m=$("#mq");m.value=Math.max(1,+m.value-1)},minc:t=>{const m=$("#mq");m.value=Math.min(+t.dataset.max,+m.value+1)},
 madd:t=>{addCart(t.dataset.id,+$("#mq").value);closeModal()},
 menu:t=>{const c=$("#cats").classList.toggle("open");t.setAttribute("aria-expanded",c)},
 cats:()=>{const el=$("#categories");el&&el.scrollIntoView({behavior:"smooth"})},
 clearf:()=>{SORT="default";AVAIL=false;if(location.hash==="#/shop"||!location.hash)rr();else location.hash="#/shop"},
 inc:t=>{const l=CART.find(x=>x.id===t.dataset.id);setQty(t.dataset.id,(l?l.qty:0)+1)},
 dec:t=>{const l=CART.find(x=>x.id===t.dataset.id);setQty(t.dataset.id,(l?l.qty:1)-1)},
 rm:t=>setQty(t.dataset.id,0),clearcart:()=>{CART=[];save();rr()},
 enter:()=>{AD.on=true;rr()},tab:t=>{AD.tab=t.dataset.t;AD.err="";AD.msg="";AD.edit=null;rr()},
 newp:()=>{AD.edit=JSON.parse(JSON.stringify(BLANK));AD.err="";rr()},
 editp:t=>{AD.edit=JSON.parse(JSON.stringify(byId(t.dataset.id)));AD.err="";rr()},cancelp:()=>{AD.edit=null;AD.err="";rr()},
 delp:t=>{const p=byId(t.dataset.id);if(confirm(`Delete "${p.name}"?`)){P=P.filter(x=>x.id!==p.id);save();rr()}},
 savep:()=>{const e=AD.edit,n=val("#ef_name").trim(),s=val("#ef_size").trim(),st=numv("#ef_stock");
  if(!n||!s){AD.err="Name and package size are required.";return rr()}
  if(!Number.isInteger(st)||st<0){AD.err="Stock must be a whole number, 0 or more.";return rr()}
  Object.assign(e,{name:n,size:s,brand:val("#ef_brand").trim(),category:val("#ef_cat"),image:val("#ef_img").trim(),description:val("#ef_desc"),stockQuantity:st,featured:$("#ef_feat").checked,visible:$("#ef_vis").checked,inStock:st>0&&$("#ef_in").checked});
  if(e.id)P=P.map(x=>x.id===e.id?e:x);else{const k=Math.max(0,...P.map(x=>+x.id.replace(/\D/g,"")||0))+1;e.id="alka-"+String(k).padStart(3,"0");P.push(e)}
  AD.edit=null;AD.err="";save();rr()},
 applym:()=>{const n=numv("#dm");if(!Number.isFinite(n)||n<5||n>10){AD.err="Markup must be between 5% and 10%.";return rr()}AD.err="";ST.defaultMarkup=n;save();AD.msg="Default markup applied.";rr()},
 savepr:t=>{const r=t.closest(".prow"),p=byId(r.dataset.id),m=r.querySelector(".pm").value,c=r.querySelector(".pc").value;
  try{calc(c,m===""?ST.defaultMarkup:m)}catch{return}
  Object.assign(p,{supplierPrice:Number(c),priceType:r.querySelector(".pt").value,sourceUrl:r.querySelector(".pu").value.trim()||null,markupPercent:m===""?null:Number(m)});p.sellingPrice=retail(p);save();toast("Saved "+p.name)},
 savepromo:t=>{const r=t.closest(".qrow"),p=byId(r.dataset.id),on=r.querySelector(".qe").checked,pr=Number(r.querySelector(".qp").value),s=r.querySelector(".qs").value,d=r.querySelector(".qd").value,b=retail(p),er=r.querySelector(".qerr");
  let m="";if(on){if(b===null)m="Set a valid supplier cost first.";else if(!Number.isInteger(pr)||pr<=0)m="Enter a promo price in whole rupiah.";else if(pr>=b)m=`Promo price must be below the retail price (${rp(b)}).`;else if(s&&d&&s>d)m="The end date must be on or after the start date."}
  er.textContent=m;if(m)return;p.featured=r.querySelector(".qf").checked;p.promo={enabled:on,price:pr>0?pr:null,start:s,end:d};save();toast("Saved "+p.name)},
 dlhtml:()=>{const src=$("#main").textContent,a=src.indexOf("const SEED="),b=src.indexOf(";\nconst DEF=");
  const js=src.slice(0,a)+"const SEED="+JSON.stringify(P)+src.slice(b);
  const html="<!doctype html>\n<html lang=\"id\">"+document.head.outerHTML+"<body><div id=\"app\"></div><div id=\"modal\"></div><div id=\"toast\" class=\"toast hidden\" role=\"status\"></div><script id=\"main\">"+js+"<\/script></body></html>";
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([html],{type:"text/html"}));l.download="alka-mart-with-photos.html";l.click();URL.revokeObjectURL(l.href)},
 osel:t=>{AD.sel=AD.sel===t.dataset.id?null:t.dataset.id;rr()},
 savesettings:()=>{const fee=numv("#s_fee"),wa=val("#s_wa").replace(/\D/g,"");
  if(!Number.isInteger(fee)||fee<0){AD.msg="Delivery fee must be a whole number, 0 or more.";return rr()}
  if(wa&&!/^62\d{8,13}$/.test(wa)){AD.msg="WhatsApp number must be in international format starting with 62, e.g. 6281234567890.";return rr()}
  Object.assign(ST,{deliveryFee:fee,whatsappNumber:wa,announcement:val("#s_ann"),tagline:val("#s_tag"),contact:{phone:val("#s_ph"),email:val("#s_em"),address:val("#s_ad"),instagram:val("#s_ig"),facebook:val("#s_fb")}});save();AD.msg="Settings saved.";rr()},
 reset:()=>{if(confirm("Reset all demo data (products, settings, orders, cart)?")){P=JSON.parse(JSON.stringify(SEED));ST={...DEF};CART=[];ORD=[];save();AD.msg="Demo data reset.";rr()}}
};
document.addEventListener("click",e=>{const t=e.target.closest("[data-act]");if(t&&ACT[t.dataset.act])ACT[t.dataset.act](t,e)});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.id==="bulk"){let n=0,bad=[];for(const f of t.files){const p=byId(f.name.replace(/\.[^.]+$/,"").toLowerCase());if(!p){bad.push(f.name);continue}try{p.image=await shrink(f);n++}catch{bad.push(f.name)}}
  const ok=sv(K.p,P);AD.msg=`${n} photo(s) added.`+(bad.length?` Not matched to a product ID: ${bad.join(", ")}.`:"")+(ok?"":" Browser storage is full, so these photos will be lost on reload. Download the HTML now.");rr();return}
 if(t.dataset.f==="cat")location.hash=shopHash({cat:t.value,q:getRoute().q.q});
 else if(t.dataset.f==="sort"){SORT=t.value;rr()}else if(t.dataset.f==="avail"){AVAIL=t.checked;rr()}
 else if(t.dataset.qin)setQty(t.dataset.qin,t.value);
 else if(t.dataset.ostat){const o=ORD.find(x=>x.number===t.dataset.ostat);if(o){o.status=t.value;save()}}});
document.addEventListener("input",e=>{const t=e.target,r=t.closest&&t.closest(".prow");
 if(r)r.querySelector(".pv").innerHTML=prev(r.querySelector(".pc").value,r.querySelector(".pm").value);
 if(t.id==="sq"){const s=t.value.trim().toLowerCase(),u=$("#sug");
  const m=s.length<2?[]:vis().filter(p=>`${p.name} ${p.brand}`.toLowerCase().includes(s)).slice(0,6);
  u.innerHTML=m.map(p=>`<li><a href="${shopHash({q:p.name})}">${esc(p.name)} <small>${esc(p.brand)} · ${esc(p.size)}</small></a></li>`).join("");u.classList.toggle("hidden",!m.length)}});
document.addEventListener("click",e=>{if(!e.target.closest(".search")){const u=$("#sug");u&&u.classList.add("hidden")}else if(e.target.closest("#sug a")){$("#sug").classList.add("hidden")}});
document.addEventListener("submit",e=>{
 if(e.target.id==="sf"){e.preventDefault();$("#sug").classList.add("hidden");location.hash=shopHash({q:$("#sq").value.trim()})}
 if(e.target.id==="cf"){e.preventDefault();const f=new FormData(e.target);CV={name:f.get("name"),phone:f.get("phone"),email:f.get("email"),address:f.get("address"),notes:f.get("notes"),pay:f.get("pay")||"Cash on Delivery"};
  CE=validate(CV);if(Object.keys(CE).length){CTOP="Please fix the highlighted fields.";return rr()}
  const no=placeOrder({name:CV.name,phone:CV.phone,email:CV.email,address:CV.address,notes:CV.notes},CV.pay);
  if(!no){CTOP="Your cart is empty.";return rr()}CV={name:"",phone:"",email:"",address:"",notes:"",pay:"Cash on Delivery"};CTOP="";location.hash="#/order/"+no}});
render();
</script>
</body>
</html>
